version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /sys/backend
      - /sys/frontend
      - /sys/e2e
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      # Minor/patch updates in one PR per directory; majors stay separate
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /sys/backend
      - /sys/frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    ignore:
      # Stay on the Node 24 LTS line; move to the next LTS deliberately
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
